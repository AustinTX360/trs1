<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you — Texas Research Supplies</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; background: #F7F6F3; color: #1A1A18; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; line-height: 1.6; }

    .check { width: 56px; height: 56px; border-radius: 50%; background: #333F48; color: #fff; display: grid; place-items: center; margin: 0 auto 1.25rem; font-size: 26px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: .5rem; color: #333F48; }
    p { color: #4A4A46; margin-bottom: .75rem; }
    a.btn { display: inline-block; margin-top: 1rem; padding: 11px 22px; background: #BF5700; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 500; }
    a.btn:hover { background: #9A4600; }
    .contact { font-size: 14px; color: #7A7A72; margin-top: 1.5rem; }
    .contact a { color: #9A4600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Thank you for your order</h1>

    <p>We'll be in touch with shipping details.</p>

    <div class="contact">Questions? Email <a href="mailto:quotes@texasresearchsupplies.com">quotes@texasresearchsupplies.com</a> or call <a href="tel:+17654308168">(765) 430-8168</a>.</div>
  </div>
</body>
</html>
